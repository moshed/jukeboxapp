<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jukebox</title>
<link rel="icon" href="../../assets/icon.png">
<meta name="robots" content="noindex,nofollow">
<!-- One opaque code per placement. `ct` is Apple's campaign token: App Store Connect
     reports page views and downloads per token under Acquisition, so the counting is
     Apple's, not ours, and no analytics script is needed. -->
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6757018633?ct=3zrb&mt=8">
<style>
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#1a1030,#0c0718 60%);color:#f4f0ff;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  img{width:88px;height:88px;border-radius:20px;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 8px;font-weight:850}
  p{color:#a99fc7;margin:0 0 20px}
  a{display:inline-block;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;
    font-weight:700;padding:13px 24px;border-radius:14px;text-decoration:none;font-size:16px}
</style>
</head>
<body>
  <div>
    <img src="../../assets/icon.png" alt="Jukebox">
    <h1>Jukebox — Party Playlist</h1>
    <p>Opening the App Store…</p>
    <a href="https://apps.apple.com/app/id6757018633?ct=3zrb&mt=8">Open the App Store</a>
  </div>
</body>
</html>

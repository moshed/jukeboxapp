<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jukebox — Vote on the Music</title>
<meta name="description" content="Join the party and vote on what plays next. No app needed.">
<link rel="icon" href="../assets/icon.png">
<style>
  :root{
    --bg1:#1a1030; --bg2:#0c0718; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.10); --text:#f4f0ff; --muted:#a99fc7; --accent:#8b5cf6; --accent2:#ec4899;
    --good:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%);
    background-attachment:fixed; min-height:100dvh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
  .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  button{font-family:inherit;cursor:pointer;border:0}
  .btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;
    padding:15px 20px;border-radius:14px;font-size:17px;width:100%}
  .btn:disabled{opacity:.5}
  input{font-family:inherit;font-size:18px;width:100%;padding:15px 16px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);color:var(--text);outline:none}
  input:focus{border-color:var(--accent)}

  /* JOIN screen */
  #join{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:400px;margin:0 auto;padding:24px}
  .logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
  .logo img{width:56px;height:56px;border-radius:14px}
  .logo h1{font-size:26px;margin:0;font-weight:850;letter-spacing:-.02em}
  .sub{color:var(--muted);text-align:center;margin:-4px 0 10px;font-size:15px}
  .code-in{text-align:center;letter-spacing:.35em;font-weight:800;font-size:26px;text-transform:uppercase}
  .err{color:#fca5a5;text-align:center;font-size:14px;min-height:18px}

  /* VOTE screen */
  #vote{display:none}
  .top{position:sticky;top:0;z-index:5;margin:-18px -16px 12px;padding:14px 16px calc(14px);
    background:linear-gradient(180deg,rgba(12,7,24,.96),rgba(12,7,24,.72));backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .np{display:flex;align-items:center;gap:12px}
  .np img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
  .np .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);font-weight:700}
  .np .t{font-weight:700;font-size:15px;line-height:1.2;margin-top:2px}
  .np .a{color:var(--muted);font-size:13px}
  .np .eq{margin-left:auto;display:flex;gap:2px;align-items:flex-end;height:20px}
  .np .eq span{width:3px;background:var(--accent2);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .np .eq span:nth-child(2){animation-delay:.2s}.np .eq span:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:6px}50%{height:18px}}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 8px}
  .hdr h2{font-size:20px;margin:0;font-weight:800}
  .remain{font-size:13px;color:var(--muted)}
  .remain b{color:var(--text)}

  .track{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:10px;margin-bottom:9px;transition:transform .08s}
  .track:active{transform:scale(.99)}
  .track.playing{border-color:var(--accent2);background:linear-gradient(90deg,rgba(236,72,153,.14),var(--card))}
  .track img{width:50px;height:50px;border-radius:9px;object-fit:cover;background:var(--card2);flex:none}
  .track .info{min-width:0;flex:1}
  .track .ti{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .ar{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:58px;height:52px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);
    color:var(--text);flex:none}
  .vote .n{font-weight:800;font-size:17px}
  .vote .c{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .vote.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  .vote.on .c{color:rgba(255,255,255,.85)}
  .vote:disabled{opacity:.55}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#2a1f45;border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:12px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:sp .8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  .searchbar{position:relative;display:flex;align-items:center;gap:8px;margin:0 0 14px}
  .searchbar .mag{position:absolute;left:14px;font-size:15px;opacity:.65;pointer-events:none}
  .searchbar input{padding:13px 40px 13px 40px;font-size:16px}
  .searchbar button{position:absolute;right:8px;width:28px;height:28px;border:0;cursor:pointer;
    border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:13px;line-height:1}
  .noresult{padding:26px 8px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<!-- JOIN -->
<div id="join">
  <div class="logo"><img src="../assets/icon.png" alt=""><h1>Jukebox</h1></div>
  <p class="sub">Join the party and vote on what plays next.</p>
  <input id="code" class="code-in" placeholder="CODE" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text">
  <input id="name" placeholder="Your name (optional)" maxlength="24" autocomplete="off">
  <button id="joinBtn" class="btn">Join Party</button>
  <div class="err" id="joinErr"></div>
  <a id="tvLink" href="../display/" style="text-align:center;color:var(--muted);font-size:14px;
     text-decoration:none;margin-top:2px">Showing this on a TV? <b style="color:var(--text)">Open Party Display →</b></a>
</div>

<!-- VOTE -->
<div id="vote">
  <div class="top">
    <div class="np" id="np" style="display:none">
      <img id="npArt" alt="">
      <div style="min-width:0">
        <div class="lbl">Now Playing</div>
        <div class="t" id="npTitle"></div>
        <div class="a" id="npArtist"></div>
      </div>
      <div class="eq"><span></span><span></span><span></span></div>
    </div>
    <div class="np" id="npIdle"><div class="lbl" style="color:var(--muted)">Nothing playing right now</div></div>
  </div>
  <div class="wrap" style="padding-top:0">
    <div class="hdr">
      <h2 id="partyName">The Queue</h2>
      <div class="remain" id="remain"></div>
    </div>
    <div class="searchbar">
      <span class="mag">🔎</span>
      <input id="q" type="search" placeholder="Search this party's songs" autocomplete="off"
             autocorrect="off" spellcheck="false" aria-label="Search songs">
      <button id="qclear" type="button" aria-label="Clear search" hidden>✕</button>
    </div>
    <div id="list"><div class="spin"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL='https://qwwztojldmmvqnavxvnf.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d3p0b2psZG1tdnFuYXZ4dm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MjgxNTEsImV4cCI6MjA4MjEwNDE1MX0.249N-HRutCLt_UWFlfchmMfemXC_jYjlQCAG6M3YNog';
const sb=createClient(URL,KEY);

const $=id=>document.getElementById(id);
const toastEl=$('toast'); let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}

let device=localStorage.getItem('jb_device'); if(!device){device=crypto.randomUUID();localStorage.setItem('jb_device',device);}
let myId=null, session=null, tracks=[], myVotes=new Set(), maxVotes=3, refetchT;

// prefill code from ?c= / #CODE, and name from storage
const params=new URLSearchParams(location.search);
document.addEventListener('input',e=>{
  if(e.target.id!=='q') return;
  query=e.target.value.trim();
  document.getElementById('qclear').hidden=!query;
  render();
});
document.addEventListener('click',e=>{
  if(e.target.id!=='qclear') return;
  const box=document.getElementById('q');
  box.value=''; query=''; e.target.hidden=true; render(); box.focus();
});
const urlCode=(params.get('c')||params.get('code')||location.hash.replace('#','')).toUpperCase().trim();
if(urlCode) $('code').value=urlCode;
if(urlCode) $('tvLink').href='../display/?c='+encodeURIComponent(urlCode);
$('code').addEventListener('input',()=>{const v=$('code').value.trim();$('tvLink').href='../display/'+(v?('?c='+encodeURIComponent(v)):'');});
$('name').value=localStorage.getItem('jb_name')||'';
$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('name').focus()});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')doJoin()});
$('joinBtn').addEventListener('click',doJoin);

function calcMax(){
  const n=tracks.length;
  const v=session?.votes_per_user_value ?? 3;
  if(session?.votes_per_user_mode==='percentage') return Math.max(1,Math.floor(n*v/100));
  return v;
}

async function doJoin(){
  const code=$('code').value.toUpperCase().trim();
  const name=($('name').value.trim())||'Guest';
  if(code.length<4){$('joinErr').textContent='Enter the party code.';return;}
  localStorage.setItem('jb_name',name==='Guest'?'':name);
  $('joinBtn').disabled=true;$('joinBtn').textContent='Joining…';$('joinErr').textContent='';
  try{
    if(!myId){
      const {data:auth,error:ae}=await sb.auth.signInAnonymously();
      if(ae) throw ae; myId=auth.user.id;
    }
    let res=await sb.rpc('join_session',{p_session_code:code,p_user_name:name,p_device_id:device});
    if(res.error && /location is required/i.test(res.error.message)){
      const pos=await getLoc();
      res=await sb.rpc('join_session',{p_session_code:code,p_user_name:name,p_device_id:device,p_user_lat:pos.lat,p_user_lon:pos.lon});
    }
    if(res.error) throw res.error;
    session=res.data.session; myId=res.data.profile_id;
    localStorage.setItem('jb_lastcode',code);
    enterVote();
  }catch(e){
    const m=(e.message||'Could not join').replace(/^.*exception:?/i,'').trim();
    $('joinErr').textContent=/not found|inactive/i.test(m)?'Party not found. Check the code.':m;
    $('joinBtn').disabled=false;$('joinBtn').textContent='Join Party';
  }
}
function getLoc(){return new Promise((resolve,reject)=>{
  if(!navigator.geolocation) return reject(new Error('Location needed but unavailable'));
  navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),
    ()=>reject(new Error('Turn on location to join this party')),{enableHighAccuracy:true,timeout:10000});
});}

async function enterVote(){
  $('join').style.display='none'; $('vote').style.display='block';
  $('partyName').textContent=session.name||'The Queue';
  await Promise.all([loadTracks(),loadMyVotes()]);
  render(); renderNP();
  subscribe();
}
async function loadTracks(){
  const {data,error}=await sb.from('session_tracks').select('*').eq('session_id',session.id).eq('is_active',true);
  if(!error) tracks=data||[];
  maxVotes=calcMax();
}
async function loadMyVotes(){
  const {data,error}=await sb.from('votes').select('track_id').eq('session_id',session.id).eq('voter_id',myId);
  if(!error) myVotes=new Set((data||[]).map(v=>v.track_id));
}
async function refreshSession(){
  const {data}=await sb.from('sessions').select('*').eq('id',session.id).single();
  if(data){session=data; if(!session.is_active){toast('This party has ended');} }
}

let query='';
// Match on title or artist, case- and accent-insensitive so "beyonce" finds "Beyoncé".
function norm(v){
  return (v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function sorted(){
  const list=[...tracks].sort((a,b)=>(b.vote_count||0)-(a.vote_count||0) || new Date(a.created_at)-new Date(b.created_at));
  if(!query) return list;
  const q=norm(query);
  return list.filter(t=>norm(t.title).includes(q) || norm(t.artist).includes(q));
}
function render(){
  const list=$('list'); const s=sorted();
  if(query && !s.length){
    list.innerHTML='<div class="noresult">No songs match \u201C'+esc(query)+'\u201D</div>';
    $('remain').innerHTML='';
    return;
  }
  const remaining=Math.max(0,maxVotes-myVotes.size);
  $('remain').innerHTML=`<b>${remaining}</b> vote${remaining===1?'':'s'} left`;
  if(!s.length){list.innerHTML='<div class="empty">No songs in the queue yet.</div>';return;}
  list.innerHTML='';
  for(const t of s){
    const voted=myVotes.has(t.id);
    const playing=session.current_track_id && t.track_id===session.current_track_id;
    const row=document.createElement('div'); row.className='track'+(playing?' playing':'');
    row.innerHTML=`
      <img src="${t.artwork_url||'../assets/icon.png'}" onerror="this.src='../assets/icon.png'" alt="">
      <div class="info"><div class="ti">${esc(t.title)}</div><div class="ar">${esc(t.artist||'')}</div></div>
      <button class="vote ${voted?'on':''}" ${(!voted&&remaining<=0)?'disabled':''} data-id="${t.id}">
        <span class="n">${t.vote_count||0}</span><span class="c">${voted?'voted':'vote'}</span>
      </button>`;
    row.querySelector('.vote').addEventListener('click',()=>toggleVote(t));
    list.appendChild(row);
  }
}
function renderNP(){
  const cur=tracks.find(t=>t.track_id===session.current_track_id);
  if(session.current_track_id && cur && session.is_playing!==false){
    $('np').style.display='flex'; $('npIdle').style.display='none';
    $('npArt').src=cur.artwork_url||'../assets/icon.png'; $('npTitle').textContent=cur.title;
    $('npArtist').textContent=cur.artist||'';
  }else{ $('np').style.display='none'; $('npIdle').style.display='flex'; }
}

async function toggleVote(t){
  const remaining=Math.max(0,maxVotes-myVotes.size);
  const voted=myVotes.has(t.id);
  if(voted){
    myVotes.delete(t.id); t.vote_count=Math.max(0,(t.vote_count||0)-1); render();
    const {error}=await sb.from('votes').delete().eq('session_id',session.id).eq('track_id',t.id).eq('voter_id',myId);
    if(error){myVotes.add(t.id);t.vote_count=(t.vote_count||0)+1;render();toast('Could not remove vote');}
  }else{
    if(remaining<=0){toast(`You've used all ${maxVotes} votes`);return;}
    myVotes.add(t.id); t.vote_count=(t.vote_count||0)+1; render();
    const {error}=await sb.from('votes').insert({id:crypto.randomUUID(),session_id:session.id,track_id:t.id,voter_id:myId,vote_weight:1});
    if(error){myVotes.delete(t.id);t.vote_count=Math.max(0,(t.vote_count||0)-1);render();
      toast(/duplicate|unique/i.test(error.message)?'Already voted for this':'Could not vote');}
  }
}

function subscribe(){
  sb.channel('t-'+session.id).on('postgres_changes',{event:'*',schema:'public',table:'session_tracks',filter:'session_id=eq.'+session.id},
    ()=>{clearTimeout(refetchT);refetchT=setTimeout(async()=>{await loadTracks();await loadMyVotes();render();renderNP();},350);}).subscribe();
  sb.channel('s-'+session.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'sessions',filter:'id=eq.'+session.id},
    p=>{session={...session,...p.new};maxVotes=calcMax();render();renderNP();}).subscribe();
  sb.channel('v-'+session.id).on('postgres_changes',{event:'*',schema:'public',table:'votes',filter:'session_id=eq.'+session.id},
    ()=>{clearTimeout(refetchT);refetchT=setTimeout(async()=>{await loadMyVotes();render();},400);}).subscribe();
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// auto-join if arriving with a code and a remembered name
if(urlCode && (localStorage.getItem('jb_name'))){ /* let user tap; keeps it intentional */ }
</script>
</body>
</html>
